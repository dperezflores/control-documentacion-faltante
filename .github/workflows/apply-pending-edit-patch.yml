name: Apply pending edit patch

on:
  push:
    branches:
      - edit-pending-records

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit-pending-records
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: pip install openpyxl

      - name: Apply source patch
        run: python tools/apply_pending_edit_patch.py

      - name: Syntax check
        run: python -m py_compile services/excel_service.py views.py

      - name: Functional regression tests
        run: |
          python - <<'PY'
          from io import BytesIO
          from openpyxl import Workbook, load_workbook
          from services.excel_service import (
              add_faltantes,
              get_faltantes,
              manual_visible_documents,
              pending_summary,
              update_pending_record,
          )

          def base_workbook(visible_text="", auditor="AUD"):
              wb = Workbook()
              ws = wb.active
              ws.title = "Req_TEST"
              ws.cell(8, 1).value = 1
              ws.cell(8, 2).value = "CT-001"
              ws.cell(8, 3).value = "Obra"
              ws.cell(8, 4).value = "Contratista"
              ws.cell(8, 5).value = visible_text
              ws.cell(8, 6).value = auditor
              ws.cell(8, 7).value = ""
              out = BytesIO()
              wb.save(out)
              return out.getvalue()

          # A) Registro técnico: conserva ID y fila, cambia texto/auditor.
          original = base_workbook()
          technical = add_faltantes(
              original,
              "Req_TEST",
              "CT-001",
              "DIR",
              "OLD",
              [{"codigo": "DIR_01", "documento": "Solicitud original", "especificacion": "Detalle"}],
              contract_row=8,
          )
          before = pending_summary(technical, "Req_TEST")
          assert len(before) == 1
          original_id = before[0]["id"]
          assert len(get_faltantes(technical, "Req_TEST")) == 1

          edited = update_pending_record(
              technical,
              "Req_TEST",
              original_id,
              "Solicitud corregida",
              "ABC",
          )
          after = pending_summary(edited, "Req_TEST")
          rows_after = get_faltantes(edited, "Req_TEST")
          assert len(after) == 1
          assert len(rows_after) == 1
          assert after[0]["id"] == original_id
          assert after[0]["documento"] == "Solicitud corregida"
          assert after[0]["especificacion"] == ""
          assert after[0]["auditor"] == "ABC"
          wb_after = load_workbook(BytesIO(edited))
          assert wb_after["Req_TEST"].cell(8, 5).value == "Solicitud corregida"
          print("TEST_A_OK")

          # B) Registro manual: se materializa como técnico Aplicación y desaparece la línea manual.
          manual_source = base_workbook("Registro manual original", auditor="MAN")
          manual_pending = pending_summary(manual_source, "Req_TEST")
          assert len(manual_pending) == 1
          manual_id = manual_pending[0]["id"]
          assert str(manual_id).startswith("MANUAL::")

          manual_edited = update_pending_record(
              manual_source,
              "Req_TEST",
              manual_id,
              "Registro manual corregido",
              "XYZ",
          )
          wb_manual = load_workbook(BytesIO(manual_edited))
          assert wb_manual["Req_TEST"].cell(8, 5).value == "Registro manual corregido"
          assert manual_visible_documents(manual_edited, "Req_TEST", "CT-001") == []
          technical_rows = get_faltantes(manual_edited, "Req_TEST")
          assert len(technical_rows) == 1
          assert technical_rows[0]["Origen"] == "Aplicación"
          assert technical_rows[0]["Documento"] == "Registro manual corregido"
          assert technical_rows[0]["Auditor"] == "XYZ"
          assert technical_rows[0]["ID"] != manual_id
          assert technical_rows[0]["Procedimiento"] in ("", None)
          assert technical_rows[0]["Codigo_documento"] in ("", None)
          assert technical_rows[0]["Corte"] == "PENDIENTE"
          print("TEST_B_OK")
          PY

      - name: Commit patched sources
        run: |
          if git diff --quiet -- services/excel_service.py views.py; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/excel_service.py views.py
          git commit -m "Agregar edición de registros pendientes"
          git push origin edit-pending-records
