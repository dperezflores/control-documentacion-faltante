name: Apply operational Excel download

on:
  push:
    branches:
      - download-operational-excel-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: download-operational-excel-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_download_operational_excel.py
      - name: Syntax check
        run: python -m py_compile views.py
      - name: Verify requested change
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('views.py').read_text(encoding='utf-8')
          assert '"Descargar Excel actualizado"' in text
          assert 'file_name="Documentacion_faltante.xlsx"' in text
          assert 'on_click="ignore"' in text
          assert 'data=operational' in text
          print('VERIFY_OK')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.py
          git commit -m "Agregar descarga directa del Excel operativo"
          git push origin download-operational-excel-v2
