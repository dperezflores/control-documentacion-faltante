name: Apply pending action popover

on:
  push:
    branches:
      - menu-acciones-pendientes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: menu-acciones-pendientes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python tools/patch_pending_action_popover.py

      - name: Syntax check
        run: python -m py_compile views.py

      - name: Verify requested structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('views.py').read_text(encoding='utf-8')
          assert text.count('with st.popover("⋮", use_container_width=True):') >= 2
          assert 'key=f"edit_pending_all_{idx}_{row[\'id\']}"' in text
          assert 'key=f"delete_pending_all_{idx}_{row[\'id\']}"' in text
          assert 'key=f"edit_pending_{idx}_{row[\'id\']}"' in text
          assert 'key=f"delete_pending_{idx}_{row[\'id\']}"' in text
          assert '"✏️ Editar"' in text
          assert '"🗑️ Eliminar"' in text
          print('VERIFY_OK')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.py
          git commit -m "Usar menú popover en acciones de pendientes"
          git push origin menu-acciones-pendientes
